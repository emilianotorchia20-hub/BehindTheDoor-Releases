name: Build single-file Behind The Door bootstrapper

on:
  push:
    branches: [bootstrap-build]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Materialize sources
        shell: pwsh
        env:
          CSPROJ_GZ_B64: ''
          PROGRAM_GZ_B64: ''
          ICON_GZ_B64: ''
        run: |
          New-Item -ItemType Directory -Force bootstrapper | Out-Null
          function Expand-B64Gzip([string]$Data,[string]$Out) {
            $bytes=[Convert]::FromBase64String($Data)
            $ms=[IO.MemoryStream]::new($bytes)
            $gz=[IO.Compression.GZipStream]::new($ms,[IO.Compression.CompressionMode]::Decompress)
            $fs=[IO.File]::Create($Out)
            $gz.CopyTo($fs)
            $fs.Dispose(); $gz.Dispose(); $ms.Dispose()
          }
          Expand-B64Gzip $env:CSPROJ_GZ_B64 'bootstrapper/BTDBootstrapper.csproj'
          Expand-B64Gzip $env:PROGRAM_GZ_B64 'bootstrapper/Program.cs'
          Expand-B64Gzip $env:ICON_GZ_B64 'bootstrapper/behind-door.ico'

      - name: Publish one self-contained EXE
        shell: pwsh
        run: |
          dotnet publish bootstrapper/BTDBootstrapper.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o dist
          if (-not (Test-Path 'dist/BehindTheDoorLauncher.exe')) { throw 'No se generó el EXE.' }
          Get-Item 'dist/BehindTheDoorLauncher.exe' | Format-List Name,Length,LastWriteTime
          Get-FileHash 'dist/BehindTheDoorLauncher.exe' -Algorithm SHA256 | Format-List

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BehindTheDoorLauncher-Setup
          path: dist/BehindTheDoorLauncher.exe
          if-no-files-found: error
          retention-days: 7
